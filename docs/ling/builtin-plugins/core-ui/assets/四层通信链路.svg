<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" width="900" height="760" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7686"/>
    </marker>
    <marker id="arw2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="760" fill="#ffffff"/>
  <text x="40" y="34" font-size="17" font-weight="700" fill="#1f2328">core-ui 四层通信链路</text>
  <text x="40" y="54" font-size="12" fill="#5b6472">面板发出的每一次调用，都要穿过三道边界；token 只在最外层的内侧，面板碰不到</text>

  <!-- 层1 浏览器 -->
  <rect x="40" y="70" width="820" height="180" rx="10" fill="#fbfcfd" stroke="#d8dde5"/>
  <text x="58" y="94" font-size="13" font-weight="600" fill="#3b4350">① 浏览器（标签页或 WebView2 窗口）</text>

  <rect x="60" y="106" width="400" height="126" rx="8" fill="#eef3ff" stroke="#b9cdf5"/>
  <text x="78" y="130" font-size="14" font-weight="600" fill="#1d3f8f">外壳　shell.html + shell.js</text>
  <text x="78" y="152" font-size="12" fill="#33508f">侧边栏 · 功能区 · 面板外框 · 设置二级界面</text>
  <text x="78" y="172" font-size="12" fill="#33508f">消息路由：按消息来源认定调用方</text>
  <rect x="78" y="190" width="118" height="24" rx="12" fill="#ffffff" stroke="#b9cdf5"/>
  <text x="137" y="206" font-size="11.5" fill="#1d3f8f" text-anchor="middle">可信 · 持有 token</text>

  <rect x="508" y="106" width="332" height="126" rx="8" fill="#f3f4f6" stroke="#c9ced6"/>
  <text x="526" y="130" font-size="14" font-weight="600" fill="#3b4350">面板 iframe</text>
  <text x="526" y="152" font-size="12" fill="#4a5260">插件目录 ui/index.html</text>
  <text x="526" y="172" font-size="12" fill="#4a5260">只能 postMessage，发不出有效请求</text>
  <rect x="526" y="190" width="126" height="24" rx="12" fill="#ffffff" stroke="#c9ced6"/>
  <text x="589" y="206" font-size="11.5" fill="#3b4350" text-anchor="middle">不可信 · 无 token</text>

  <!-- 源边界 -->
  <line x1="484" y1="100" x2="484" y2="232" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="484" y="96" font-size="11.5" fill="#c0392b" text-anchor="middle">源边界</text>
  <line x1="508" y1="150" x2="466" y2="150" stroke="#c0392b" stroke-width="1.4" marker-end="url(#arw2)"/>
  <text x="487" y="140" font-size="11" fill="#c0392b" text-anchor="middle">postMessage</text>

  <!-- 箭头 1 -->
  <line x1="450" y1="250" x2="450" y2="306" stroke="#6b7686" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="466" y="272" font-size="12" fill="#3b4350">POST /api/*　带 Bearer token</text>
  <text x="466" y="290" font-size="11.5" fill="#7a8390">面板资源与 theme.css 免 token（只读静态文件）</text>
  <line x1="40" y1="262" x2="820" y2="262" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="5 4"/>
  <rect x="46" y="238" width="66" height="16" fill="#ffffff"/>
  <text x="52" y="250" font-size="11.5" fill="#c0392b">token 边界</text>

  <!-- 层2 core-ui 进程 -->
  <rect x="40" y="312" width="820" height="140" rx="10" fill="#fbfcfd" stroke="#d8dde5"/>
  <text x="58" y="336" font-size="13" font-weight="600" fill="#3b4350">② core-ui 进程（侧车）</text>

  <rect x="60" y="350" width="248" height="84" rx="8" fill="#eef3ff" stroke="#b9cdf5"/>
  <text x="78" y="374" font-size="13" font-weight="600" fill="#1d3f8f">静态资源服务</text>
  <text x="78" y="394" font-size="11.5" fill="#33508f">/panel/&lt;插件 id&gt;/* 读 ui/ 目录</text>
  <text x="78" y="412" font-size="11.5" fill="#33508f">/ 与 /shell.* 读内嵌的外壳页面</text>

  <rect x="326" y="350" width="248" height="84" rx="8" fill="#eef3ff" stroke="#b9cdf5"/>
  <text x="344" y="374" font-size="13" font-weight="600" fill="#1d3f8f">/api 代理</text>
  <text x="344" y="394" font-size="11.5" fill="#33508f">校验 token 与 method 命名空间</text>
  <text x="344" y="412" font-size="11.5" fill="#33508f">翻译成一次管理端口调用</text>

  <rect x="592" y="350" width="248" height="84" rx="8" fill="#eef3ff" stroke="#b9cdf5"/>
  <text x="610" y="374" font-size="13" font-weight="600" fill="#1d3f8f">管理端口客户端</text>
  <text x="610" y="394" font-size="11.5" fill="#33508f">建连、认证、帧收发</text>
  <text x="610" y="412" font-size="11.5" fill="#33508f">错误码翻译成人话</text>

  <!-- 箭头 2 -->
  <line x1="450" y1="452" x2="450" y2="508" stroke="#6b7686" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="466" y="486" font-size="12" fill="#3b4350">管理端口 127.0.0.1:7900　jsonl 帧协议</text>

  <!-- 层3 宿主 -->
  <rect x="40" y="514" width="820" height="92" rx="10" fill="#fbfcfd" stroke="#d8dde5"/>
  <text x="58" y="538" font-size="13" font-weight="600" fill="#3b4350">③ 宿主进程</text>
  <rect x="60" y="548" width="780" height="44" rx="8" fill="#eef3ff" stroke="#b9cdf5"/>
  <text x="78" y="575" font-size="12.5" fill="#1d3f8f">kernel.call 路由　·　能力校验（fs / network / ui / shell）　·　插件方法表　·　写效应账本</text>

  <!-- 箭头 3 -->
  <line x1="450" y1="606" x2="450" y2="662" stroke="#6b7686" stroke-width="1.6" marker-end="url(#arw)"/>
  <text x="466" y="640" font-size="12" fill="#3b4350">kernel.call("rm.scan")</text>
  <line x1="40" y1="636" x2="820" y2="636" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="5 4"/>
  <rect x="46" y="612" width="66" height="16" fill="#ffffff"/>
  <text x="52" y="624" font-size="11.5" fill="#c0392b">能力边界</text>

  <!-- 层4 插件 -->
  <rect x="40" y="668" width="820" height="62" rx="10" fill="#fbfcfd" stroke="#d8dde5"/>
  <text x="58" y="692" font-size="13" font-weight="600" fill="#3b4350">④ 插件进程</text>
  <rect x="60" y="698" width="180" height="22" rx="11" fill="#f3f4f6" stroke="#c9ced6"/>
  <text x="150" y="713" font-size="11.5" fill="#3b4350" text-anchor="middle">resources-manager</text>
  <rect x="252" y="698" width="120" height="22" rx="11" fill="#f3f4f6" stroke="#c9ced6"/>
  <text x="312" y="713" font-size="11.5" fill="#3b4350" text-anchor="middle">player</text>
  <text x="392" y="713" font-size="11.5" fill="#7a8390">面板与插件本体是两层：面板只调自己，跨插件由插件本体经宿主中转</text>

  <text x="40" y="750" font-size="11" fill="#8a929e">注：箭头方向是「面板发起一次调用」的实际路径；返回结果沿原路回来，图中省略。</text>
</svg>
